<title>Creatorlink Sans KR 스펙</title>
<style>
/*FONTFACE*/
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--ink:#1B1F26;--ink-2:#454B55;--muted:#6C7380;--line:#E0E4EA;--line-2:#EEF0F3;
  --accent:#2C63D9;--accent-soft:#E9F0FF;--accent-ink:#1E4BB0;--ok:#1F8F55;--ok-soft:#E3F5EA;--warn:#B7791F;--warn-soft:#FFF3DA;
  --mark:rgba(44,99,217,.10);
  --ui:'CL-latin-roboto','CL-otf',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115;--surface:#171A20;--ink:#E8EBF0;--ink-2:#C3C9D3;--muted:#8F98A6;--line:#2A2F39;--line-2:#20242C;
  --accent:#7DA6FF;--accent-soft:#1B2A4A;--accent-ink:#A9C2FF;--ok:#4CC282;--ok-soft:#14301F;--warn:#E0A94A;--warn-soft:#3A2C12;--mark:rgba(125,166,255,.14);}}
:root[data-theme="dark"]{
  --bg:#0F1115;--surface:#171A20;--ink:#E8EBF0;--ink-2:#C3C9D3;--muted:#8F98A6;--line:#2A2F39;--line-2:#20242C;
  --accent:#7DA6FF;--accent-soft:#1B2A4A;--accent-ink:#A9C2FF;--ok:#4CC282;--ok-soft:#14301F;--warn:#E0A94A;--warn-soft:#3A2C12;--mark:rgba(125,166,255,.14);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:19px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.top h1{font-size:14px;line-height:20px;font-weight:700;margin:0 6px 0 0;letter-spacing:0}
.chip{font-size:11px;line-height:16px;padding:1px 7px;border-radius:4px;background:var(--line-2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.ctl{display:flex;align-items:center;gap:6px}
.ctl>span{font-size:11px;line-height:16px;color:var(--muted);letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{padding:3px 9px;font-size:12px;line-height:18px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.seg button:hover:not(.on){background:var(--line-2)}
.wrap{padding:20px;display:grid;grid-template-columns:1fr;gap:20px;max-width:1240px;margin:0 auto}
.wrap.cmp{grid-template-columns:1fr 1fr;max-width:none}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.pane[hidden]{display:none}
.pane .bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:41px;background:var(--surface);z-index:4;border-radius:8px 8px 0 0}
.pane .bar .tag{font-size:11px;line-height:16px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:1px 6px;border-radius:4px}
.pane[data-kr="otf"]{--kr:'CL-otf'} .pane[data-kr="ttf"]{--kr:'CL-ttf'} .pane[data-kr="raw"]{--kr:'CL-raw'}
.pane[data-lat="roboto"]{--lat:'CL-latin-roboto'} .pane[data-lat="inter"]{--lat:'CL-latin-inter'} .pane[data-lat="none"]{--lat:var(--kr)}
.pane[data-tnum="1"] .content{font-variant-numeric:tabular-nums}
.content{font-family:var(--lat),var(--kr),sans-serif;padding:4px 16px 24px;color:var(--ink)}
.content h2{font-size:12px;line-height:18px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:24px 0 10px;padding-top:16px;border-top:1px solid var(--line-2)}
.content h2:first-child{border-top:0;padding-top:12px;margin-top:0}
.content h2 small{font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px}
.note{font-size:12px;line-height:18px;color:var(--muted);margin:0 0 12px;max-width:72ch}
/* 1. scale */
.scale{display:grid;grid-template-columns:96px 1fr;gap:0 16px;border-top:1px solid var(--line-2)}
.scale>div{padding:9px 0;border-bottom:1px solid var(--line-2);min-width:0}
.scale .k{font-family:var(--ui);font-size:11px;line-height:16px;color:var(--muted);padding-top:11px}
.scale .k b{display:block;color:var(--ink-2);font-weight:500}
.scale .s{display:flex;flex-direction:column;gap:2px}
.scale .s span{display:block;white-space:nowrap;overflow-x:auto}
.scale .s span::before{content:attr(data-w);font-family:var(--ui);font-size:10px;line-height:1;color:var(--muted);display:inline-block;width:26px;font-weight:400;font-variant-numeric:tabular-nums;vertical-align:baseline}
/* 2. ui mock */
.mock{border:1px solid var(--line);border-radius:6px;display:grid;grid-template-columns:200px 1fr;overflow:hidden;font-size:13px;line-height:19px}
.mock .side{background:var(--bg);border-right:1px solid var(--line);padding:10px 8px}
.mock .side .t{font-size:11px;line-height:16px;font-weight:700;color:var(--muted);padding:4px 8px;letter-spacing:.02em}
.mock .side .it{padding:5px 8px;border-radius:4px;display:flex;justify-content:space-between;gap:8px}
.mock .side .it.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.mock .side .it em{font-style:normal;font-size:11px;color:var(--muted)}
.mock .main{padding:12px 14px;min-width:0;overflow-x:auto}
.mock .head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.mock .head h3{font-size:16px;line-height:24px;font-weight:700;margin:0}
.mock .head .btns{display:flex;gap:6px}
.btn{font-size:13px;line-height:19px;font-weight:500;padding:4px 10px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.inp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:5px;padding:5px 10px;margin-bottom:10px;color:var(--muted);font-size:13px;line-height:19px;max-width:360px}
.inp b{color:var(--ink);font-weight:400}
table.tb{border-collapse:collapse;width:100%;font-size:13px;line-height:19px}
.tb th{font-size:11px;line-height:16px;font-weight:500;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.tb td.r,.tb th.r{text-align:right}
.tb td.d{color:var(--muted);font-size:12px}
.bd{display:inline-block;font-size:11px;line-height:16px;font-weight:500;padding:0 6px;border-radius:4px;background:var(--line-2);color:var(--ink-2)}
.bd.ok{background:var(--ok-soft);color:var(--ok)} .bd.wn{background:var(--warn-soft);color:var(--warn)}
/* 3. tnum */
.num{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.num>div{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.num h4{margin:0 0 6px;font-size:11px;line-height:16px;font-weight:500;color:var(--muted);letter-spacing:.02em;font-family:var(--ui)}
.num .rows{font-size:13px;line-height:22px}
.num .rows div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line-2)}
.num .rows span:last-child{background:var(--mark);padding:0 2px}
.num .pro{font-variant-numeric:proportional-nums} .num .tab{font-variant-numeric:tabular-nums}
/* 4. line box */
.lbx{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;font-size:14px;line-height:normal;max-width:640px}
.lbx .lb{background:var(--mark);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbx .lb.b{font-weight:700}
.lbx .k,.lbx .m{font-family:var(--ui);font-size:11px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lbx .m b{color:var(--ink);font-weight:500}
/* 5. body */
.body{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.body p{margin:0;max-width:34em}
.body .lab{font-family:var(--ui);font-size:11px;line-height:16px;color:var(--muted);margin-bottom:4px}
/* 6. glyphs */
.gl{font-size:12px;line-height:20px;word-break:break-all;color:var(--ink-2)}
.gl b{font-weight:500;color:var(--ink)}
.gl .row{display:flex;gap:10px;align-items:baseline}
.gl .row .k{font-family:var(--ui);font-size:10px;color:var(--muted);width:72px;flex:none}
@media (max-width:820px){.wrap.cmp{grid-template-columns:1fr}.mock{grid-template-columns:1fr}.mock .side{border-right:0;border-bottom:1px solid var(--line)}.num{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.seg button{transition:background .12s}}
</style>

<script>
(function(){
  var tpl=document.getElementById('tpl');
  document.querySelectorAll('.pane .content').forEach(function(c){c.appendChild(tpl.content.cloneNode(true));});
  function seg(el,fn){el.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});fn(b.dataset.v);});}
  document.querySelectorAll('.pane').forEach(function(p){p.querySelectorAll('.seg[data-key]').forEach(function(s){seg(s,function(v){p.dataset[s.dataset.key]=v;measure();});});});
  seg(document.getElementById('zoom'),function(v){document.querySelectorAll('.content').forEach(function(c){c.style.zoom=v;});measure();});
  seg(document.getElementById('cmp'),function(v){document.getElementById('B').hidden=v!=='1';document.getElementById('wrap').classList.toggle('cmp',v==='1');measure();});
  function measure(){requestAnimationFrame(function(){document.querySelectorAll('.pane').forEach(function(p){var ms=p.querySelectorAll('[data-m]');p.querySelectorAll('.lb').forEach(function(lb,i){var h=lb.getBoundingClientRect().height/(parseFloat(p.querySelector('.content').style.zoom)||1);ms[i].innerHTML='<b>'+h.toFixed(2)+'</b> px';});});});}
  var ua=navigator.userAgent, os=/Windows/.test(ua)?'Windows':/Mac/.test(ua)?'macOS':/Android/.test(ua)?'Android':/iPhone|iPad/.test(ua)?'iOS':'기타';
  var br=/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':/Firefox\//.test(ua)?'Firefox':'브라우저';
  document.getElementById('env').textContent=os+' · '+br+' · DPR '+(window.devicePixelRatio||1);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(measure);}else{measure();}
  window.addEventListener('resize',measure);
})();
</script>
